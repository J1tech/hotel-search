# hotel-search PROD deploy
# IDs: al-rais-mds/deploy/prod/aws-prod-infra.md
# Secrets: SSM via serverless-ssm-fetch (/provesio/*). .env: GOOGLE_PLACES_API_KEY, optional GIATA/unified overrides.
# GIATA imageProxy: /al-rais/prod/giata/* (enrichment SSM may be added later — env fallbacks below).
# After deploy: npm run patch:feCloudFrontPlaces:prod  (FE CloudFront E28BQARL94API9 /places/* cache policies)

service: hotel-search
frameworkVersion: "3"

custom:
  dotenv:
    path: .env
  serverlessSsmFetch:
    USERNAME: /provesio/username~true
    PASSWORD: /provesio/password~true
    COMPANY_CODE: /provesio/companycode~true
    X_API_KEY: /provesio/xapikey~true
    BASE_URL: /provesio/baseurl~true
    COGNITO_CLIENT_ID: /provesio/cognitouserid~true
    GUEST_JWT_SECRET: /provesio/jwtguestsecret~true
    COGNITO_USERPOOL_ID: /provesio/cognitouserpoolid~true
    GIATA_USERNAME: /al-rais/prod/giata/username~true
    GIATA_PASSWORD: /al-rais/prod/giata/password~true

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1
  stage: ${opt:stage, 'prod'}

  vpc:
    securityGroupIds:
      - !Ref LambdaSecurityGroup
    subnetIds:
      - subnet-062ad9a4fe69c4088
      - subnet-08e3e5f2ff7317b17

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:PutObjectTagging
          Resource:
            - arn:aws:s3:::log-trace-prod/*

        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - arn:aws:sqs:eu-west-1:${aws:accountId}:add-log-queue-${self:provider.stage}
            - arn:aws:sqs:${aws:region}:${aws:accountId}:add-to-cart-queue-${self:provider.stage}
            - arn:aws:sqs:${aws:region}:${aws:accountId}:update-expired-hotel-booking-queue-${self:provider.stage}

        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/logtrace-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/logtrace-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-book-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-book-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-pre-book-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-pre-book-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-cancellation-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-cancellation-policies-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/search-filter-prod
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/search-filter-prod/index/*

        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: arn:aws:lambda:eu-west-1:${aws:accountId}:function:al-rais-giata-svc-prod-enrich

  environment:
    STAGE: ${self:provider.stage}
    USERNAME: ${self:custom.serverlessSsmFetch.USERNAME}
    PASSWORD: ${self:custom.serverlessSsmFetch.PASSWORD}
    COMPANY_CODE: ${self:custom.serverlessSsmFetch.COMPANY_CODE}
    X_API_KEY: ${self:custom.serverlessSsmFetch.X_API_KEY}
    BASE_URL: ${self:custom.serverlessSsmFetch.BASE_URL}
    INTERNAL_BASE_URL: ${env:INTERNAL_BASE_URL, 'https://yxa1w6bvvd.execute-api.eu-west-1.amazonaws.com'}
    INTERNAL_SUPPLIER_ROUTING_KEY: ${env:INTERNAL_SUPPLIER_ROUTING_KEY, 'dev-internal-supplier-routing-key'}
    REDIS_HOST: redis-rg-prod.nwwpvi.ng.0001.euw1.cache.amazonaws.com
    REDIS_PORT: 6379
    COGNITO_CLIENT_ID: ${self:custom.serverlessSsmFetch.COGNITO_CLIENT_ID}
    GUEST_JWT_SECRET: ${self:custom.serverlessSsmFetch.GUEST_JWT_SECRET}
    GUEST_TOKEN_TTL: ${env:GUEST_TOKEN_TTL, '3600'}
    COGNITO_USERPOOL_ID: ${self:custom.serverlessSsmFetch.COGNITO_USERPOOL_ID}
    COGNITO_REGION: ${env:COGNITO_REGION, 'eu-west-1'}
    LOG_TRACE_SQS: https://sqs.eu-west-1.amazonaws.com/${aws:accountId}/add-log-queue-${self:provider.stage}
    LOG_TRACE_BUCKET: log-trace-prod
    REGION: eu-west-1
    region: eu-west-1
    LOG_TRACE_TABLE: logtrace-${self:provider.stage}
    HOTEL_BOOK_TABLE: hotel-book-${self:provider.stage}
    HOTEL_PRE_BOOK_TABLE: hotel-pre-book-${self:provider.stage}
    HOTEL_CANCELLATION_TABLE: hotel-cancellation-${self:provider.stage}
    HOTEL_CANCELLATION_POLICY_TABLE: hotel-cancellation-policies-${self:provider.stage}
    USER_FILTER_TABLE: search-filter-prod
    ADD_TO_CART_QUEUE: https://sqs.${aws:region}.amazonaws.com/${aws:accountId}/add-to-cart-queue-${self:provider.stage}
    UPDATE_EXPIRED_HOTEL_BOOKING: https://sqs.${aws:region}.amazonaws.com/${aws:accountId}/update-expired-hotel-booking-queue-${self:provider.stage}
    CACHE_TTL_DEFAULT: "60"
    ASYNC_POLL_INTERVAL_MS: "3000"
    ASYNC_POLL_MAX_ATTEMPTS: "10"
    GIATA_ENRICHMENT_ENABLED: ${env:GIATA_ENRICHMENT_ENABLED, 'false'}
    GIATA_ENRICH_FUNCTION_ARN: arn:aws:lambda:eu-west-1:${aws:accountId}:function:al-rais-giata-svc-prod-enrich
    GIATA_USERNAME: ${self:custom.serverlessSsmFetch.GIATA_USERNAME}
    GIATA_PASSWORD: ${self:custom.serverlessSsmFetch.GIATA_PASSWORD}
    UNIFIED_SESSIONS_API_BASE: ${env:UNIFIED_SESSIONS_API_BASE, 'https://1wo8ihkto6.execute-api.eu-west-1.amazonaws.com/prod'}
    UNIFIED_SESSIONS_WRITE_SECRET: ${env:UNIFIED_SESSIONS_WRITE_SECRET, ''}
    GOOGLE_PLACES_API_KEY: ${env:GOOGLE_PLACES_API_KEY, ''}
    GEO_GEOCODE_CACHE_TTL: ${env:GEO_GEOCODE_CACHE_TTL, '604800'}
    GEO_SEARCH_DEFAULT_RADIUS_KM: ${env:GEO_SEARCH_DEFAULT_RADIUS_KM, '5'}
    GEO_PLACES_AUTOCOMPLETE_CACHE_TTL: ${env:GEO_PLACES_AUTOCOMPLETE_CACHE_TTL, '259200'}
    GEO_PLACES_DETAILS_CACHE_TTL: ${env:GEO_PLACES_DETAILS_CACHE_TTL, '604800'}

package:
  patterns:
    - "!./**"
    - handlers/**
    - helper/**
    - lib/**
    - package.json
    - package-lock.json
    - .env
    - node_modules/**
    - "!node_modules/**/test/**"
    - "!node_modules/**/tests/**"
  excludeDevDependencies: true

functions:
  hotelSearch:
    handler: handlers/hotelSearch.handler
    name: hotel-search-${self:provider.stage}-hotelSearch
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /hotelSearch
          method: post
          cors: &cors
            origin: "*"
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  placesAutocomplete:
    handler: handlers/placesAutocomplete.handler
    name: hotel-search-${self:provider.stage}-placesAutocomplete
    timeout: 30
    memorySize: 256
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /places/autocomplete
          method: get
          cors: *cors

  placesDetails:
    handler: handlers/placesDetails.handler
    name: hotel-search-${self:provider.stage}-placesDetails
    timeout: 30
    memorySize: 256
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /places/details
          method: get
          cors: *cors

  hotelDetail:
    handler: handlers/hotelDetail.handler
    name: hotel-search-${self:provider.stage}-hotelDetail
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /hotelDetail
          method: post
          cors: *cors

  getMoreRooms:
    handler: handlers/getMoreRooms.handler
    name: hotel-search-${self:provider.stage}-getMoreRooms
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /getMoreRooms
          method: post
          cors: *cors

  hotelPreBook:
    handler: handlers/hotelPreBook.handler
    name: hotel-search-${self:provider.stage}-hotelPreBook
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /hotelPreBook
          method: post
          cors: *cors

  hotelBooking:
    handler: handlers/hotelBooking.handler
    name: hotel-search-${self:provider.stage}-hotelBooking
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /hotelBooking
          method: post
          cors: *cors

  hotelRetrieve:
    handler: handlers/hotelRetrieve.handler
    name: hotel-search-${self:provider.stage}-hotelRetrieve
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /hotelRetrieve
          method: post
          cors: *cors

  hotelCancellation:
    handler: handlers/hotelCancellation.handler
    name: hotel-search-${self:provider.stage}-hotelCancellation
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /hotelCancellation
          method: post
          cors: *cors

  getHotelCancellationPolicy:
    handler: handlers/getHotelCancellationPolicy.handler
    name: hotel-search-${self:provider.stage}-getHotelCancellationPolicy
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /getHotelCancellationPolicy
          method: post
          cors: *cors

  getAdminHotelCancellationPolicy:
    handler: handlers/getAdminHotelCancellationPolicy.handler
    name: hotel-search-${self:provider.stage}-getAdminHotelCancellationPolicy
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /getAdminHotelCancellationPolicy
          method: post
          cors: *cors

  getHotelCancellationCharges:
    handler: handlers/getHotelCancellationCharges.handler
    name: hotel-search-${self:provider.stage}-getHotelCancellationCharges
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /getHotelCancellationCharges
          method: post
          cors: *cors

  myHotelBooking:
    handler: handlers/myHotelBooking.handler
    name: hotel-search-${self:provider.stage}-myHotelBooking
    timeout: 30
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:1
    events:
      - http:
          path: /myHotelBooking
          method: post
          cors: *cors

  checkHotelBookingStatus:
    handler: handlers/checkHotelBookingStatus.handler
    name: hotel-search-${self:provider.stage}-checkHotelBookingStatus
    timeout: 30
    memorySize: 512
    events:
      - schedule: rate(1 minute)

  imageProxy:
    handler: handlers/imageProxy.handler
    name: hotel-search-${self:provider.stage}-imageProxy
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /imageProxy
          method: get
          cors: *cors

  updateExpiredHotelBooking:
    handler: handlers/updateExpiredHotelBooking.handler
    name: hotel-search-${self:provider.stage}-updateExpiredHotelBooking
    timeout: 120
    memorySize: 1024
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - updateExpiredHotelBooking
              - Arn
          batchSize: 10

  # invokeHotelBookingEmail, createHotelPaymentSession, getHotelPaymentSession,
  # getHotelReviews, getReviewsOverview — managed outside this stack on prod.

resources:
  Resources:
    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for hotel-search Lambdas
        VpcId: vpc-014652d2ee7151658
        SecurityGroupEgress:
          - IpProtocol: -1
            CidrIp: 0.0.0.0/0

    RedisSecurityGroupIngress:
      Type: AWS::EC2::SecurityGroupIngress
      Properties:
        IpProtocol: tcp
        FromPort: 6379
        ToPort: 6379
        GroupId: sg-031e9942c3d60eb70
        SourceSecurityGroupId: !Ref LambdaSecurityGroup

    updateExpiredHotelBookingDLQ:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      Properties:
        QueueName: update-expired-hotel-booking-dlq-${self:provider.stage}
        MessageRetentionPeriod: 1209600

    updateExpiredHotelBooking:
      Type: AWS::SQS::Queue
      DeletionPolicy: Retain
      Properties:
        QueueName: update-expired-hotel-booking-queue-${self:provider.stage}
        VisibilityTimeout: 300
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt updateExpiredHotelBookingDLQ.Arn
          maxReceiveCount: 5

    HotelBookTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: hotel-book-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: bookingReferenceId
            AttributeType: S
          - AttributeName: hotelKey
            AttributeType: S
        KeySchema:
          - AttributeName: bookingReferenceId
            KeyType: HASH
          - AttributeName: hotelKey
            KeyType: RANGE

    HotelPreBookTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: hotel-pre-book-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: bookingKey
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: bookingKey
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: status-bookingKey-index
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: bookingKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: userId-status-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: status
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    HotelCancellationTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: hotel-cancellation-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: bookingReferenceId
            AttributeType: S
          - AttributeName: bookingStatus
            AttributeType: S
        KeySchema:
          - AttributeName: bookingReferenceId
            KeyType: HASH
          - AttributeName: bookingStatus
            KeyType: RANGE

    HotelCancellationPolicyTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: hotel-cancellation-policies-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: hotelKey
            AttributeType: S
          - AttributeName: searchKey
            AttributeType: S
        KeySchema:
          - AttributeName: hotelKey
            KeyType: HASH
          - AttributeName: searchKey
            KeyType: RANGE
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    PlacesAutocompleteCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: hotel-search-${self:provider.stage}-places-autocomplete
          Comment: Cache GET /places/autocomplete by query params (not Authorization)
          DefaultTTL: 259200
          MaxTTL: 259200
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true
            HeadersConfig:
              HeaderBehavior: none
            CookiesConfig:
              CookieBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: whitelist
              QueryStrings:
                - q
                - query
                - countryBias
                - country
                - languageCode
                - language

    PlacesDetailsCachePolicy:
      Type: AWS::CloudFront::CachePolicy
      Properties:
        CachePolicyConfig:
          Name: hotel-search-${self:provider.stage}-places-details
          Comment: Cache GET /places/details by placeId + language (not Authorization)
          DefaultTTL: 604800
          MaxTTL: 604800
          MinTTL: 0
          ParametersInCacheKeyAndForwardedToOrigin:
            EnableAcceptEncodingGzip: true
            EnableAcceptEncodingBrotli: true
            HeadersConfig:
              HeaderBehavior: none
            CookiesConfig:
              CookieBehavior: none
            QueryStringsConfig:
              QueryStringBehavior: whitelist
              QueryStrings:
                - placeId
                - languageCode
                - language

  Outputs:
    PlacesAutocompleteCachePolicyId:
      Description: CloudFront cache policy ID for FE /places/autocomplete behavior
      Value: !Ref PlacesAutocompleteCachePolicy
    PlacesDetailsCachePolicyId:
      Description: CloudFront cache policy ID for FE /places/details behavior
      Value: !Ref PlacesDetailsCachePolicy
    ApiGatewayUrl:
      Description: Direct API Gateway base (hotelSearch and non-cached routes)
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}"

plugins:
  - serverless-dotenv-plugin
  - serverless-ssm-fetch
