# hotel-search dev deploy
# Secrets: SSM via serverless-ssm-fetch (/provesio/*). .env: authorizer/cognito overrides (bundled in zip).
# GIATA: SSM params GIATA_ENRICHMENT_ENABLED + GIATA_ENRICH_FUNCTION_ARN (confirm paths in Parameter Store).

service: hotel-search
frameworkVersion: "3"

custom:
  dotenv:
    path: .env
  serverlessSsmFetch:
    USERNAME: /provesio/username~true
    PASSWORD: /provesio/password~true
    COMPANY_CODE: /provesio/companycode~true
    X_API_KEY: /provesio/xapikey~true
    BASE_URL: /provesio/baseurl~true
    COGNITO_CLIENT_ID: /provesio/cognitouserid~true
    GUEST_JWT_SECRET: /provesio/jwtguestsecret~true
    COGNITO_USERPOOL_ID: /provesio/cognitouserpoolid~true
    GIATA_ENRICHMENT_ENABLED: /provesio/GIATA_ENRICHMENT_ENABLED~true
    GIATA_ENRICH_FUNCTION_ARN: /provesio/GIATA_ENRICH_FUNCTION_ARN~true
    GIATA_USERNAME: /al-rais/dev/giata/username~true
    GIATA_PASSWORD: /al-rais/dev/giata/password~true

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1
  stage: ${opt:stage, 'dev'}

  vpc:
    securityGroupIds:
      - !Ref LambdaSecurityGroup
    subnetIds:
      - subnet-025cd3d6f9357cc16
      - subnet-0db7e348636b19ee6

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:PutObjectAcl
            - s3:PutObjectTagging
          Resource:
            - arn:aws:s3:::log-trace-dev2/*

        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - arn:aws:sqs:eu-west-1:${aws:accountId}:add-log-queue-${self:provider.stage}
            - arn:aws:sqs:${aws:region}:${aws:accountId}:add-to-cart-queue-${self:provider.stage}
            - arn:aws:sqs:${aws:region}:${aws:accountId}:update-expired-hotel-booking-${self:provider.stage}
            - arn:aws:sqs:${aws:region}:${aws:accountId}:invoke-hotel-booking-email-${self:provider.stage}

        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/logtrace-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/logtrace-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-book-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-book-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-pre-book-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-pre-book-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-cancellation-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/user-filter-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/users-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/users-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/countries-listing-${self:provider.stage}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/countries-listing-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/hotel-google-places-${self:provider.stage}

        - Effect: Allow
          Action: lambda:InvokeFunction
          Resource: arn:aws:lambda:eu-west-1:648485682397:function:al-rais-giata-svc-dev-enrich

  environment:
    STAGE: ${self:provider.stage}
    USERNAME: ${self:custom.serverlessSsmFetch.USERNAME}
    PASSWORD: ${self:custom.serverlessSsmFetch.PASSWORD}
    COMPANY_CODE: ${self:custom.serverlessSsmFetch.COMPANY_CODE}
    X_API_KEY: ${self:custom.serverlessSsmFetch.X_API_KEY}
    BASE_URL: ${self:custom.serverlessSsmFetch.BASE_URL}
    INTERNAL_BASE_URL: ${env:INTERNAL_BASE_URL}
    INTERNAL_SUPPLIER_ROUTING_KEY: ${env:INTERNAL_SUPPLIER_ROUTING_KEY}
    REDIS_HOST: redis-rg-dev2.tforef.ng.0001.euw1.cache.amazonaws.com
    REDIS_PORT: 6379
    COGNITO_CLIENT_ID: ${self:custom.serverlessSsmFetch.COGNITO_CLIENT_ID}
    GUEST_JWT_SECRET: ${self:custom.serverlessSsmFetch.GUEST_JWT_SECRET}
    GUEST_TOKEN_TTL: ${env:GUEST_TOKEN_TTL, '3600'}
    COGNITO_USERPOOL_ID: ${self:custom.serverlessSsmFetch.COGNITO_USERPOOL_ID}
    COGNITO_REGION: ${env:COGNITO_REGION, 'eu-west-1'}
    LOG_TRACE_SQS: https://sqs.eu-west-1.amazonaws.com/648485682397/add-log-queue-${self:provider.stage}
    LOG_TRACE_BUCKET: log-trace-dev2
    REGION: eu-west-1
    region: eu-west-1
    LOG_TRACE_TABLE: logtrace-${self:provider.stage}
    HOTEL_BOOK_TABLE: hotel-book-${self:provider.stage}
    HOTEL_PRE_BOOK_TABLE: hotel-pre-book-${self:provider.stage}
    HOTEL_CANCELLATION_TABLE: hotel-cancellation-${self:provider.stage}
    USER_FILTER_TABLE: user-filter-${self:provider.stage}
    USERS_TABLE: users-${self:provider.stage}
    COUNTRIES_LISTING_TABLE: countries-listing-${self:provider.stage}
    ADD_TO_CART_QUEUE: https://sqs.${aws:region}.amazonaws.com/${aws:accountId}/add-to-cart-queue-${self:provider.stage}
    UPDATE_EXPIRED_HOTEL_BOOKING: https://sqs.${aws:region}.amazonaws.com/${aws:accountId}/update-expired-hotel-booking-${self:provider.stage}
    CACHE_TTL_DEFAULT: "60"
    ASYNC_POLL_INTERVAL_MS: "3000"
    ASYNC_POLL_MAX_ATTEMPTS: "10"
    GIATA_ENRICHMENT_ENABLED: ${self:custom.serverlessSsmFetch.GIATA_ENRICHMENT_ENABLED}
    GIATA_ENRICH_FUNCTION_ARN: ${self:custom.serverlessSsmFetch.GIATA_ENRICH_FUNCTION_ARN}
    GIATA_USERNAME: ${self:custom.serverlessSsmFetch.GIATA_USERNAME}
    GIATA_PASSWORD: ${self:custom.serverlessSsmFetch.GIATA_PASSWORD}
    GOOGLE_PLACES_API_KEY: ${env:GOOGLE_PLACES_API_KEY}
    HOTEL_GOOGLE_PLACES_TABLE: hotel-google-places-${self:provider.stage}
    GOOGLE_REVIEWS_CACHE_TTL: "21600"

package:
  patterns:
    - "!./**"
    - handlers/**
    - helper/**
    - lib/**
    - package.json
    - package-lock.json
    - .env
    - node_modules/**
    - "!node_modules/**/test/**"
    - "!node_modules/**/tests/**"
  excludeDevDependencies: true

functions:
  hotelSearch:
    handler: handlers/hotelSearch.handler
    name: hotel-search-${self:provider.stage}-hotelSearch
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /hotelSearch
          method: post
          cors: &cors
            origin: "*"
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  hotelDetail:
    handler: handlers/hotelDetail.handler
    name: hotel-search-${self:provider.stage}-hotelDetail
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /hotelDetail
          method: post
          cors: *cors

  getHotelReviews:
    handler: handlers/getHotelReviews.handler
    name: hotel-search-${self:provider.stage}-getHotelReviews
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /getHotelReviews
          method: post
          cors: *cors

  getMoreRooms:
    handler: handlers/getMoreRooms.handler
    name: hotel-search-${self:provider.stage}-getMoreRooms
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /getMoreRooms
          method: post
          cors: *cors

  hotelPreBook:
    handler: handlers/hotelPreBook.handler
    name: hotel-search-${self:provider.stage}-hotelPreBook
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /hotelPreBook
          method: post
          cors: *cors

  hotelBooking:
    handler: handlers/hotelBooking.handler
    name: hotel-search-${self:provider.stage}-hotelBooking
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /hotelBooking
          method: post
          cors: *cors

  hotelRetrieve:
    handler: handlers/hotelRetrieve.handler
    name: hotel-search-${self:provider.stage}-hotelRetrieve
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /hotelRetrieve
          method: post
          cors: *cors

  hotelCancellation:
    handler: handlers/hotelCancellation.handler
    name: hotel-search-${self:provider.stage}-hotelCancellation
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /hotelCancellation
          method: post
          cors: *cors

  getHotelCancellationPolicy:
    handler: handlers/getHotelCancellationPolicy.handler
    name: hotel-search-${self:provider.stage}-getHotelCancellationPolicy
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /getHotelCancellationPolicy
          method: post
          cors: *cors

  getHotelCancellationCharges:
    handler: handlers/getHotelCancellationCharges.handler
    name: hotel-search-${self:provider.stage}-getHotelCancellationCharges
    timeout: 60
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /getHotelCancellationCharges
          method: post
          cors: *cors

  myHotelBooking:
    handler: handlers/myHotelBooking.handler
    name: hotel-search-${self:provider.stage}-myHotelBooking
    timeout: 30
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /myHotelBooking
          method: post
          cors: *cors

  checkHotelBookingStatus:
    handler: handlers/checkHotelBookingStatus.handler
    name: hotel-search-${self:provider.stage}-checkHotelBookingStatus
    timeout: 60
    memorySize: 512
    events:
      - http:
          path: /checkHotelBookingStatus
          method: post
          cors: *cors

  imageProxy:
    handler: handlers/imageProxy.handler
    name: hotel-search-${self:provider.stage}-imageProxy
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /imageProxy
          method: get
          cors: *cors

  updateExpiredHotelBooking:
    handler: handlers/updateExpiredHotelBooking.handler
    name: hotel-search-${self:provider.stage}-updateExpiredHotelBooking
    timeout: 60
    memorySize: 512
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${aws:accountId}:update-expired-hotel-booking-${self:provider.stage}
          batchSize: 10

  invokeHotelBookingEmail:
    handler: handlers/invokeHotelBookingEmail.handler
    name: hotel-search-${self:provider.stage}-invokeHotelBookingEmail
    timeout: 60
    memorySize: 512
    events:
      - sqs:
          arn: arn:aws:sqs:${aws:region}:${aws:accountId}:invoke-hotel-booking-email-${self:provider.stage}
          batchSize: 5

resources:
  Resources:
    LambdaSecurityGroup:
      Type: AWS::EC2::SecurityGroup
      Properties:
        GroupDescription: Security group for hotel-search Lambdas
        VpcId: vpc-0622a975b106604e0
        SecurityGroupEgress:
          - IpProtocol: -1
            CidrIp: 0.0.0.0/0

    RedisSecurityGroupIngress:
      Type: AWS::EC2::SecurityGroupIngress
      Properties:
        IpProtocol: tcp
        FromPort: 6379
        ToPort: 6379
        GroupId: sg-09bec78477dacc22b
        SourceSecurityGroupId: !Ref LambdaSecurityGroup

    HotelGooglePlacesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: hotel-google-places-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: placeLookupHash
            AttributeType: S
        KeySchema:
          - AttributeName: placeLookupHash
            KeyType: HASH

plugins:
  - serverless-dotenv-plugin
  - serverless-ssm-fetch
